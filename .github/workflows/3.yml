name: Build Playr IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: |
          npm install
          # App + Browser plugins are needed for the Spotify login to return to the app.
          # Same major version as Capacitor itself, so they always match.
          MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
          npm install "@capacitor/app@$MAJOR" "@capacitor/browser@$MAJOR"

      - name: Create the iOS project
        run: npx cap add ios

      - name: Set app icon
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -f assets/icon-1024.png || { echo "assets/icon-1024.png is missing"; exit 1; }
          test -d "$ICON_DIR" || { echo "Icon folder not found"; exit 1; }
          cp assets/icon-1024.png "$ICON_DIR/AppIcon-512@2x.png"

      - name: Register the playr:// link (Spotify login returns here)
        run: |
          PLIST="ios/App/App/Info.plist"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          $PB -c "Add :CFBundleURLTypes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLName string playr" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string playr" "$PLIST"
          $PB -c "Print :CFBundleURLTypes" "$PLIST"

      - name: Copy the web app into iOS
        run: npx cap sync ios

      - name: Build (unsigned)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Playr.ipa Payload

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Playr-ipa
          path: Playr.ipa
